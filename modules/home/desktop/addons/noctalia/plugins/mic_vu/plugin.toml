# Mic VU meter for the noctalia bar (issue #37, slice 4). Ships as a
# Nix-managed path source: the module substitutes @SOURCE_MATCH@ and the
# tool paths in service.luau at build time, so this directory is a
# template, not the runtime copy.

id          = "sab/mic_vu"
name        = "Mic VU Meter"
version     = "1.0.0"
# Written against the pinned rev's current API (28). Declaring the floor (3)
# instead would make the first upstream floor bump silently drop the plugin;
# manifest widget actions below additionally require >= 14.
plugin_api  = 28
author      = "sab"
license     = "MIT"
icon        = "microphone"
description = "Analog-ballistics VU meter for a microphone input, fed by pw-cat."
tags        = ["audio"]

# Plugin-level setting: shared by the capture service and the widget.
[[setting]]
key             = "source_match"
type            = "string"
label_key       = "settings.source_match.label"
description_key = "settings.source_match.description"
default         = "@SOURCE_MATCH@"

[[widget]]
id    = "meter"
entry = "widget.luau"

  # Same interactions the old waybar meter had. Declared here (not as
  # `[widget.<name>.actions]` in config.toml, which the widget-settings
  # schema flags as an unknown setting) — these are gesture *defaults*,
  # so a config-level actions table still overrides them.
  [widget.actions]
  left        = "exec @MIC_CTL@ mute"
  right       = "exec @PAVUCONTROL@ -t 3"
  scroll_up   = "exec @MIC_CTL@ vol-up"
  scroll_down = "exec @MIC_CTL@ vol-down"

  [[widget.setting]]
  key       = "meter_width"
  type      = "int"
  label_key = "settings.meter_width.label"
  default   = 46
  min       = 16
  max       = 200

[[service]]
id    = "capture"
entry = "service.luau"
