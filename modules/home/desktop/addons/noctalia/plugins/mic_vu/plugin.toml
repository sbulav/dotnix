# Mic VU meter for the noctalia bar (issue #37, slice 4). Ships as a
# Nix-managed path source: the module substitutes the helper paths here and
# the source match + tool paths in service.luau at build time, so this
# directory is a template, not the runtime copy.

id          = "sab/mic_vu"
name        = "Mic VU Meter"
version     = "1.0.0"
# Written against the pinned rev's current API (51). Declaring the floor (3)
# instead would make the first upstream floor bump silently drop the plugin;
# what this plugin actually needs is >= 14 (manifest widget actions below),
# >= 24 (argv runAsync for the mute/gain queries) and >= 31 (getColor for the
# palette-coloured face).
plugin_api  = 51
author      = "sab"
license     = "MIT"
icon        = "microphone"
description = "Analog-ballistics VU meter for a microphone input, fed by pw-cat."
tags        = ["audio"]

# Deliberately NO [[setting]] for the source match: the value is baked by
# Nix into BOTH service.luau (the meter) and akg-mic-ctl (the click/scroll
# helper). A GUI-editable setting would retarget only the meter at runtime
# and silently desync it from its own controls.

[[widget]]
id    = "meter"
entry = "widget.luau"

  # Same interactions the old waybar meter had. Declared here (not as
  # `[widget.<name>.actions]` in config.toml, which the widget-settings
  # schema flags as an unknown setting) — these are gesture *defaults*,
  # so a config-level actions table still overrides them.
  # pavucontrol tabs are 1-based: Playback, Recording, Output Devices,
  # Input Devices, Configuration — 4 is the sources tab this widget meters.
  [widget.actions]
  left        = "exec @MIC_CTL@ mute"
  right       = "exec @PAVUCONTROL@ -t 4"
  scroll_up   = "exec @MIC_CTL@ vol-up"
  scroll_down = "exec @MIC_CTL@ vol-down"

  [[widget.setting]]
  key       = "meter_width"
  type      = "int"
  label_key = "settings.meter_width.label"
  # 2:1 face: 44 wide is 22 tall, the full height of the 22 px bar.
  default   = 44
  min       = 16
  max       = 200

[[service]]
id    = "capture"
entry = "service.luau"
